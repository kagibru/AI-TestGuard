name: AI-TestGuard - Tests et couverture

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov ruff

      - name: Verifier la qualite du code
        run: |
          python -m ruff check app tests scripts

      - name: Executer les tests et mesurer la couverture
        run: |
          mkdir -p reports
          python -m pytest tests/ -v \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --junitxml=reports/junit.xml \
            --cov-fail-under=85

      - name: Conserver les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-testguard-test-reports
          path: |
            reports/coverage.xml
            reports/junit.xml
          if-no-files-found: warn
